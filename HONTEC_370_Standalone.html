<script>/* HONTEC 370 - pure, testable calculation functions. All lengths are mm.
   Machine constants are taken from the table and representative confirmation
   supplied by the owner. Do not add mounting tape to K a second time. */
(function (root) {
  'use strict';
  const PITCH = 3.175, K = 6.05;
  const DEFAULT_CYLINDERS = Object.freeze([88,90,98,106,111,117,124,135,149,189]);
  const DEFAULT_ROLLS = Object.freeze([100,150,200,250,300,310,350]);
  const EPS = 1e-9;
  function number(raw) {
    if (typeof raw === 'number') return Number.isFinite(raw) ? raw : NaN;
    const str = String(raw ?? '').trim()
      .replace(/[\u0660-\u0669]/g, ch => String(ch.charCodeAt(0) - 0x0660))
      .replace(/[\u06f0-\u06f9]/g, ch => String(ch.charCodeAt(0) - 0x06f0))
      .replace(/[\u066b,]/g, '.');
    if (!/^\+?(?:\d+(?:\.\d*)?|\.\d+)$/.test(str)) return NaN;
    const n = Number(str);
    return Number.isFinite(n) ? n : NaN;
  }
  function validTeeth(n) { return Number.isInteger(n) && n >= 2 && n <= 10000; }
  function validSize(n) { return Number.isFinite(n) && n >= 0.01 && n <= 10000; }
  function cylinder(teeth) {
    if (!validTeeth(teeth)) throw new RangeError('Invalid tooth count');
    const repeat = teeth * PITCH;
    const plateRepeat = repeat - K;
    const scaleFactor = plateRepeat / repeat;
    return {teeth, repeat, plateRepeat, scaleFactor,
      reductionPct: K / repeat * 100, scalePct: scaleFactor * 100};
  }
  function reducedLength(length, teeth) {
    if (!validSize(length)) throw new RangeError('Invalid artwork length');
    return length * cylinder(teeth).scaleFactor;
  }
  // Original calculator: repeat / count >= md + gap - 0.5.
  // The optional 0.5 mm allowance is a shortfall in gap PER REPEAT PITCH,
  // not a subtraction from the cylinder circumference or the distortion K.
  // Physical labels must never overlap, even when gap < tolerance.
  // Keep the original ranking: smallest permitted pitch/gap, max 13 by default.
  function candidates(md, gap, cylinders, maxUps = 13, lockedUps = 0, tolerance = 0) {
    if (!validSize(md) || !Number.isFinite(gap) || gap < 0 || gap > 10000 ||
        !Number.isInteger(maxUps) || maxUps < 1 || maxUps > 100 ||
        !Number.isInteger(lockedUps) || lockedUps < 0 || lockedUps > maxUps || ![0, 0.5].includes(tolerance))
      throw new RangeError('Invalid search input');
    const effectiveGap = Math.max(0, gap - tolerance);
    const found = [];
    for (const teeth of [...new Set(cylinders)]) {
      if (!validTeeth(teeth)) continue;
      const c = cylinder(teeth);
      const fit = Math.min(maxUps, Math.floor((c.repeat + EPS) / (md + effectiveGap)));
      const around = lockedUps || fit;
      if (around < 1 || around > fit) continue;
      const pitchMd = c.repeat / around;
      const actualGap = pitchMd - md;
      if (actualGap + EPS < effectiveGap) continue;
      found.push({...c, around, pitchMd, gapMd: Math.max(0, actualGap),
        requestedGap: gap, tolerance, usedTolerance: actualGap < gap - EPS,
        afterMd: md * c.scaleFactor, afterPitchMd: pitchMd * c.scaleFactor,
        afterGapMd: Math.max(0, actualGap) * c.scaleFactor});
    }
    return found.sort((a,b) => a.gapMd - b.gapMd || a.repeat - b.repeat || b.around - a.around);
  }
  // Gaps exist BETWEEN labels. The outer margins are separate minimums.
  function across(cd, roll, gap, margin) {
    if (!validSize(cd) || !validSize(roll) || !Number.isFinite(gap) || gap < 0 || gap > 10000 ||
        !Number.isFinite(margin) || margin < 0 || margin > 10000)
      throw new RangeError('Invalid roll layout');
    const usable = roll - 2 * margin;
    const count = usable < -EPS ? 0 : Math.max(0, Math.floor((usable + gap + EPS) / (cd + gap)));
    const used = count ? count * cd + (count - 1) * gap : 0;
    const net = count * cd;
    return {count, usable, used, net, roll, cd, gap, margin,
      actualMargin: (roll - used) / 2,
      wasteWidth: roll - net, wasteWidthPct: 100 * (1 - net / roll)};
  }
  function layout(selected, web, md) {
    if (!selected || !web || web.count < 1 || !validSize(md)) throw new RangeError('No valid layout');
    const total = selected.around * web.count;
    const usefulArea = total * md * web.cd;
    const totalArea = selected.repeat * web.roll;
    return {...selected, web, md, total, usefulArea, totalArea,
      wasteAreaPct: Math.max(0, 100 * (1 - usefulArea / totalArea))};
  }
  const api = Object.freeze({PITCH,K,DEFAULT_CYLINDERS,DEFAULT_ROLLS,number,validTeeth,validSize,cylinder,reducedLength,candidates,across,layout});
  root.FlexoMath = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);</script>

<script>/* FLEXO 370 v3.1.7: one screen, Arabic/English, horizontal cylinder preview.
   No external libraries, tracking or network calculation. */
(() => {
'use strict';
const F = window.FlexoMath;
const $ = id => document.getElementById(id);
const KEY = 'flexo370_state_v3';
const TEXT_FIELDS = ['md','cd','roll','customTeeth','gapMd','gapCd','webMargin'];
const SELECT_FIELDS = ['cylinder','aroundCount'];
const STRING_FIELDS = [...TEXT_FIELDS,...SELECT_FIELDS];
const EPS = 1e-9;
let storageOK = true, readyOffline = false, installEvent = null;
let toastTimer, announceTimer, last = null;
function defaults() {
  return {schema:3,lang:'ar',cylinders:[...F.DEFAULT_CYLINDERS],rolls:[...F.DEFAULT_ROLLS],maxUps:13,
    form:{md:'',cd:'',roll:'350',cylinder:'auto',customTeeth:'',gapMd:'3',gapCd:'3',webMargin:'4',aroundCount:'0',tolerance:true}};
}
function validList(list,check) {
  return Array.isArray(list) && list.length<=500 && list.every(check);
}
function unique(list) {return [...new Set(list)].sort((a,b)=>a-b);}
function validate(src) {
  if(!src || src.schema!==3 || !['ar','en'].includes(src.lang) || !validList(src.cylinders,F.validTeeth) ||
     !validList(src.rolls,F.validSize) || !Number.isInteger(src.maxUps) || src.maxUps<1 || src.maxUps>100 ||
     !src.form || typeof src.form!=='object' || typeof src.form.tolerance!=='boolean') throw new Error('Invalid state');
  const out=defaults(); out.lang=src.lang;out.cylinders=unique(src.cylinders);out.rolls=unique(src.rolls);out.maxUps=src.maxUps;
  for(const key of STRING_FIELDS) {
    if(typeof src.form[key]!=='string' || src.form[key].length>40) throw new Error('Invalid field');
    out.form[key]=src.form[key];
  }
  out.form.tolerance=src.form.tolerance;
  return out;
}
function migrateV2(src) {
  if(!src || src.schema!==2 || !validList(src.cylinders,F.validTeeth) || !validList(src.rolls,F.validSize) ||
     !Number.isInteger(src.maxUps) || src.maxUps<1 || src.maxUps>100 || !src.form) throw new Error('Invalid v2 state');
  const out=defaults(), old=src.form;
  out.cylinders=unique(src.cylinders);out.rolls=unique(src.rolls);out.maxUps=src.maxUps;
  const mapping={md:'labelMd',cd:'labelCd',gapMd:'gapMd',gapCd:'gapCd',webMargin:'margin',aroundCount:'aroundCount',cylinder:'layoutCylinder'};
  for(const [key,oldKey] of Object.entries(mapping)) {
    if(typeof old[oldKey]==='string' && old[oldKey].length<=40) out.form[key]=old[oldKey];
  }
  const roll=old.rollSelect==='custom'?old.customRoll:old.rollSelect;
  if(typeof roll==='string' && roll.length<=40) out.form.roll=roll;
  // Preserve a previous distortion-only workflow without a second tab/input.
  if(src.tab==='distortion') {
    if(typeof old.dCylinder==='string') out.form.cylinder=old.dCylinder;
    if(typeof old.dTeeth==='string') out.form.customTeeth=old.dTeeth;
    if(!out.form.md && typeof old.dLength==='string') out.form.md=old.dLength;
  }
  return validate(out);
}
function readState() {
  try {
    const saved=localStorage.getItem(KEY);
    if(saved && saved.length<1000000) {try{return validate(JSON.parse(saved));}catch(_){}}
    const v2=localStorage.getItem('flexo370_state_v2');
    if(v2 && v2.length<1000000) {try{return migrateV2(JSON.parse(v2));}catch(_){}}
    const out=defaults();
    for(const [oldKey,key,check] of [['cylRepeatCalc_cylinders','cylinders',F.validTeeth],['cylRepeatCalc_materials','rolls',F.validSize]]) {
      const raw=localStorage.getItem(oldKey);
      if(raw && raw.length<1000000) {try{const list=JSON.parse(raw);if(validList(list,check))out[key]=unique(list);}catch(_){}}
    }
    return out;
  } catch(_) {storageOK=false;return defaults();}
}
let state=readState();
function t(key,args={}) {
  const text=FLEXO_TRANSLATIONS[state.lang][key] ?? FLEXO_TRANSLATIONS.en[key] ?? key;
  return text.replace(/\{(\w+)\}/g,(_,name)=>String(args[name] ?? ''));
}
const fmt=(n,d=3)=>Number.isFinite(n)?Number(n.toFixed(d)).toString():'\u2014';
const fixed=(n,d=4)=>Number.isFinite(n)?n.toFixed(d):'\u2014';
const mm=(n,d=3)=>fmt(n,d)+' mm';
const pct=n=>fixed(n)+'%';
function text(id,value) {$(id).textContent=String(value);}
function esc(value) {return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));}
function save() {
  try {localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(_){storageOK=false;}
  $('storageWarning').hidden=storageOK;
}
function toast(key,args={}) {
  clearTimeout(toastTimer);text('toast',t(key,args));$('toast').hidden=false;
  toastTimer=setTimeout(()=>$('toast').hidden=true,3500);
}
function errorBox(id,errors) {text(id,errors.join(' '));$(id).hidden=errors.length===0;}
function repair() {
  const cyl=state.form.cylinder;
  if(!['auto','custom'].includes(cyl) && !state.cylinders.includes(F.number(cyl))) {
    if(F.validTeeth(F.number(cyl))) {state.form.customTeeth=cyl;state.form.cylinder='custom';}
    else state.form.cylinder='auto';
  }
  const n=F.number(state.form.aroundCount);
  if(!Number.isInteger(n) || n<0 || n>state.maxUps) state.form.aroundCount='0';
}
function fillControls() {
  repair();
  const cylinder=$('cylinder'),around=$('aroundCount'),rolls=$('rollList');
  [cylinder,around,rolls].forEach(el=>el.replaceChildren());
  cylinder.add(new Option(t('auto'),'auto'));
  for(const n of state.cylinders)cylinder.add(new Option(String(n),String(n)));
  cylinder.add(new Option(t('custom'),'custom'));
  around.add(new Option(t('auto'),'0'));
  for(let n=1;n<=state.maxUps;n++)around.add(new Option(String(n),String(n)));
  for(const w of state.rolls){const o=document.createElement('option');o.value=String(w);rolls.append(o);}
  for(const id of STRING_FIELDS) $(id).value=state.form[id];
  $('tolerance').checked=state.form.tolerance;
  $('customTeethField').hidden=state.form.cylinder!=='custom';
}
function applyLanguage() {
  document.documentElement.lang=state.lang;document.documentElement.dir=state.lang==='ar'?'rtl':'ltr';
  document.title=t('pageTitle');
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll('[data-title]').forEach(el=>{el.title=t(el.dataset.title);el.setAttribute('aria-label',t(el.dataset.title));});
  text('languageText',state.lang==='ar'?'English':'\u0627\u0644\u0639\u0631\u0628\u064a\u0629');
  $('languageText').lang=state.lang==='ar'?'en':'ar';
  $('resultCard').setAttribute('aria-label',t('resultFor'));
  fillControls();render();updateStatus();
}
function read(id,label,errors,min=0.01,max=10000,integer=false,optional=false) {
  const raw=$(id).value.trim();
  if(optional && raw==='')return null;
  const n=F.number(raw),ok=Number.isFinite(n)&&n>=min&&n<=max&&(!integer||Number.isInteger(n));
  $(id).setAttribute('aria-invalid',String(!ok));
  if(!ok)errors.push(t(integer?'invalidNumber':'invalidDecimal',{label:t(label),min,max}));
  return ok?n:null;
}
function render() {
  const errors=[];
  STRING_FIELDS.forEach(id=>$(id).removeAttribute('aria-invalid'));
  $('customTeethField').hidden=state.form.cylinder!=='custom';
  const md=read('md','md',errors,0.01,10000,false,true), cd=read('cd','cd',errors,0.01,10000,false,true);
  const roll=read('roll','roll',errors),gapMd=read('gapMd','gapMd',errors,0),gapCd=read('gapCd','gapCd',errors,0);
  const webMargin=read('webMargin','edgeMargin',errors,0),around=read('aroundCount','around',errors,0,state.maxUps,true);
  const auto=state.form.cylinder==='auto',tolerance=state.form.tolerance?0.5:0;
  let c=null, selected=null, layout=null, candidates=[];
  if(!auto) {
    const id=state.form.cylinder==='custom'?'customTeeth':'cylinder';
    const teeth=read(id,'customTeeth',errors,2,10000,true);
    if(teeth!==null)c=F.cylinder(teeth);
  }
  if(md!==null && gapMd!==null && around!==null) {
    candidates=F.candidates(md,gapMd,auto?state.cylinders:(c?[c.teeth]:[]),state.maxUps,around,tolerance);
    selected=candidates[0] ?? null;
    if(auto)c=selected;
    if(!selected && (auto||c)) errors.push(t(auto?(state.cylinders.length?'noCylinderFit':'noCylinders'):'manualNoFit'));
  }
  if(selected && md!==null && cd!==null && roll!==null && gapCd!==null && webMargin!==null && errors.length===0) {
    const web=F.across(cd,roll,gapCd,webMargin);
    if(web.count<1)errors.push(t('rollNoFit'));else layout=F.layout(selected,web,md);
  }
  errorBox('calcErrors',errors);
  text('toleranceHint',t('toleranceHint')+(gapMd!==null?' '+t('effectiveGap')+': '+mm(Math.max(0,gapMd-tolerance)):''));
  last={c,layout,md,cd,roll,gapMd,gapCd,webMargin,tolerance,errors:[...errors]};
  renderCalculationDetails();
  $('results').hidden=!c;$('emptyResult').hidden=Boolean(c);
  $('diagram').replaceChildren();$('diagram').hidden=!layout;
  $('diagramPlaceholder').hidden=Boolean(layout);text('diagramPlaceholder',t(errors.length?'diagramInvalid':'diagramEmpty'));
  $('layoutKpis').hidden=!layout;$('legend').hidden=!layout;
  $('copyBtn').disabled=!c||errors.length>0;$('svgBtn').disabled=!layout||errors.length>0;$('pdfBtn').disabled=!c||errors.length>0;$('printBtn').disabled=!c||errors.length>0;
  document.querySelectorAll('[data-layout-only]').forEach(el=>el.hidden=!layout);
  if(!c){text('liveResult','');return;}
  text('resCylinderLabel',t(auto?'suggested':'chosen'));
  text('resTeeth',c.teeth);text('resRepeat',fmt(c.repeat));text('resAfterCylinder',fmt(c.plateRepeat));text('resDistortion',fixed(c.reductionPct));
  
  if(layout) {
    const l=layout;
    text('resCounts',l.around+' \u00d7 '+l.web.count);text('resGap',fmt(l.gapMd));
    text('resRepeatSize',fmt(l.pitchMd,3));text('resGapAcross',fmt(l.web.gap));text('resNetAcross',fmt(l.web.net));
    
    $('diagram').innerHTML=makePreview(l);
    $('diagram').setAttribute('aria-label',t('diagramLabel',{repeat:fmt(l.repeat),roll:fmt(l.web.roll),around:l.around,across:l.web.count,total:l.total}));
  }
  clearTimeout(announceTimer);
  announceTimer=setTimeout(()=>text('liveResult',t('cylinder')+' '+c.teeth+'. '+t('distortion')+' '+pct(c.reductionPct)),450);
}
// Preview and SVG share the same geometry. X is cylinder repeat (MD),

function labelGeometry(l,factor,ox,oy,preview=false) {

      const x=startX+col*pitchX,y=startY+row*pitchY;
      out.push(`<rect data-label="true" x="${N(x)}" y="${N(y)}" width="${N(w)}" height="${N(h)}" fill="#bdd5ba" stroke="#638f6c" stroke-width="${stroke}"/>`);

    }

  <text x="${N(ox+w/2)}" y="${N(oy+h+35)}" text-anchor="middle" direction="${state.lang==='ar'?'rtl':'ltr'}" font-family="Tahoma,Arial,sans-serif" font-size="12" fill="#8c704f">${esc(t('mdArrow'))}</text>

// Self-contained, offline A4 PDF exporter. Canvas preserves Arabic shaping on mobile.
function jpegToPdf(jpegBytes,pxWidth,pxHeight) {
  const encoder=new TextEncoder(),parts=[];let length=0;
  const offsets=[0];
  const write=bytes=>{parts.push(bytes);length+=bytes.length;};
  const ascii=value=>write(encoder.encode(value));
  const object=(id,body)=>{offsets[id]=length;ascii(id+' 0 obj\n'+body+'\nendobj\n');};
  ascii('%PDF-1.4\n%PDF-export\n');
  object(1,'<< /Type /Catalog /Pages 2 0 R >>');
  object(2,'<< /Type /Pages /Count 1 /Kids [3 0 R] >>');
  object(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.276 841.89] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
  offsets[4]=length;
  ascii('4 0 obj\n<< /Type /XObject /Subtype /Image /Width '+pxWidth+' /Height '+pxHeight+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpegBytes.length+' >>\nstream\n');
  write(jpegBytes);ascii('\nendstream\nendobj\n');
  const content=encoder.encode('q\n595.276 0 0 841.89 0 0 cm\n/Im0 Do\nQ\n');
  offsets[5]=length;
  ascii('5 0 obj\n<< /Length '+content.length+' >>\nstream\n');write(content);ascii('endstream\nendobj\n');
  const xref=length;
  ascii('xref\n0 6\n0000000000 65535 f \n');
  for(let i=1;i<=5;i++)ascii(String(offsets[i]).padStart(10,'0')+' 00000 n \n');
  ascii('trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF\n');
  return new Blob(parts,{type:'application/pdf'});
}
function calculationRows(result=last) {
  if(!result?.c)return [];
  const {c,layout:l,md,cd,roll,gapCd}=result;
  const original=md!==null?mm(md)+(cd!==null?' × '+mm(cd):''):'—';
  return [
    ['label size',original],
    ['Cylinder','Z'+c.teeth+' T'],
    ['Repeat Length',l?mm(l.pitchMd,4):'—'],
    ['Cylinder length',mm(c.repeat)],
    ['Cylinder length after distortion',mm(c.plateRepeat)],
    ['Distortion',fixed(c.reductionPct,4)+'%'],
    ['Material width',roll!==null?mm(roll):'—'],
    ['Around No.',l?String(l.around):'—'],
    ['Across No.',l?String(l.web.count):'—'],
    ['Gap Around',l?mm(l.gapMd,4):'—'],
    ['Gap across',gapCd!==null?mm(gapCd):'—'],
    ['Layout across material, with gaps',l?mm(l.web.used):'—'],
    ['Layout across material, without gaps',l?mm(l.web.net):'—'],
    ['Material width waste',l?mm(l.web.wasteWidth):'—'],
    ['Geometric area waste',l?fixed(l.wasteAreaPct,2)+'%':'—']

}
const detailLabelsAr=['مقاس الاستيكر','السليندر','مقاس الريبيت','مقاس السليندر','مقاس السليندر بعد الديستورشن','الديستورشن','عرض الخامة','عدد التكرارات حول السليندر','عدد التكرارات على عرض الخامة','جاب حول السليندر','جاب أكروس','توزيع الخامة بالجابات','توزيع الخامة بدون جابات','هالك عرض الخامة','هالك المساحة'];
function displayCalculationRows(result=last,lang=state.lang) {

}
function renderCalculationDetails() {

function previewImage(svg) {
  const viewBox=svg.match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/);
  const width=Number(viewBox[1]),height=Number(viewBox[2]);
  // Explicit intrinsic size keeps SVG-to-canvas rendering consistent on mobile.
  const source=svg.replace('<svg ',`<svg width="${width*3}" height="${height*3}" `);
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>resolve({img,width,height});
    img.onerror=()=>reject(new Error('Layout image unavailable'));
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(source);
  });
}
async function reportCanvas() {
  const snapshot=last,lang=state.lang;
  const rows=displayCalculationRows(snapshot,lang);
  const layoutSvg=snapshot.layout?makePreview(snapshot.layout):null;
  const preview=layoutSvg?await previewImage(layoutSvg):null;
  const canvas=document.createElement('canvas');canvas.width=1488;canvas.height=2104;
  const ctx=canvas.getContext('2d',{alpha:false});
  if(!ctx)throw new Error('Canvas unavailable');
  const {layout:l}=snapshot;
  const ar=lang==='ar',side=ar?'right':'left';
  ctx.scale(canvas.width/1200,canvas.height/1700);
  const text=(str,x,y,size=23,color='#213a32',align=side,bold=false,rtl=ar)=>{
    ctx.save();ctx.fillStyle=color;ctx.font=(bold?'700 ':'400 ')+size+'px Tahoma,Arial,sans-serif';
    ctx.textAlign=align;ctx.direction=rtl?'rtl':'ltr';ctx.fillText(String(str),x,y);ctx.restore();
  };
  const rounded=(x,y,w,h,r,fill,stroke)=>{
    ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
    ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke();}
  };
  ctx.fillStyle='#f5f7f4';ctx.fillRect(0,0,1200,1700);
  rounded(52,52,1096,136,18,'#163e36');
  text('Cylinders repeat calc | HONTEC 370',82,133,39,'#ffffff','left',true,false);
  const metrics=rows;
  for(let i=0;i<metrics.length;i++){
    const y=220+i*48;
    rounded(65,y,1070,46,5,i%2===0?'#ffffff':'#edf2ed');
    const labelX=ar?1114:84;
    text(metrics[i][0]+':',labelX,y+31,25,'#526e5d',side,false,ar);
    ctx.font='400 25px Tahoma,Arial,sans-serif';
    const labelWidth=ctx.measureText(metrics[i][0]+':').width;
    const valueX=labelX+(ar?-1:1)*(labelWidth+14);
    text(metrics[i][1],valueX,y+31,27,'#213a32',side,true,false);
  }
  text('Layout',68,1000,28,'#213a32','left',true,false);
  rounded(65,1024,1070,470,16,'#ffffff','#dfe7df');
  if(preview){
    const factor=Math.min(1020/preview.width,420/preview.height);
    const width=preview.width*factor,height=preview.height*factor;
    ctx.drawImage(preview.img,600-width/2,1259-height/2,width,height);
  } else text(lang==='ar'?'أدخل أبعاد الليبل لإظهار التوزيع':'Enter label dimensions for layout',600,1260,24,'#687c70','center');

}
async function exportPdf() {
  if(!last?.c || last.errors.length)return;
  $('exportMenu').open=false;

    for(let i=0;i<raw.length;i++)jpg[i]=raw.charCodeAt(i);

function parseList(raw,check) {

  const tokens=raw.trim().split(/[\s,;\u060c\u061b]+/).filter(Boolean),list=tokens.map(F.number);
